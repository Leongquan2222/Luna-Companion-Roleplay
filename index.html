<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna - AI Companion</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <!-- File CSS Custom -->
  <link rel="stylesheet" href="ai.css">
</head>
<body>

  <div class="app-container d-flex">
    <!-- SIDEBAR LỊCH SỬ TRÒ CHUYỆN -->
    <aside class="sidebar d-flex flex-column p-3">
      <h6 class="fw-bold text-light mb-3">LỊCH SỬ TRÒ CHUYỆN</h6>

      <div class="mb-3">
        <input type="text" id="searchHistory" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Tìm lịch sử...">
      </div>

      <div id="historyList" class="history-list flex-grow-1 overflow-auto">
        <!-- Render động từ ai.js -->
      </div>

      <div class="pt-3 border-top border-secondary mt-auto">
        <button id="clearBtn" class="btn btn-sm btn-outline-danger w-100">Xóa lịch sử</button>
      </div>
    </aside>

    <!-- KHUNG CHAT CHÍNH -->
    <main class="chat-main d-flex flex-column flex-grow-1 h-100">
      <!-- Header -->
      <header class="chat-header p-3 border-bottom border-secondary d-flex align-items-center gap-3">
        <div class="avatar-circle">🌙</div>
        <div>
          <h5 class="m-0 text-light fw-bold">Luna</h5>
          <span class="text-success small">● Online</span>
        </div>
      </header>

      <!-- Khung hiển thị nội dung Chat (chiếm trọn khoảng trống còn lại) -->
      <div id="chatBody" class="chat-body p-3 flex-grow-1 overflow-auto">
        <div class="message luna-message mb-3">
        </div>
      </div>

      <!-- Footer Input (Gom chung nút Viết tiếp cùng 1 hàng) -->
      <footer class="chat-footer p-3 border-top border-secondary">
        <div class="d-flex gap-2">
          <input type="text" id="prompt" class="form-control bg-dark text-light border-secondary" placeholder="Nhập tin nhắn..." autocomplete="off">
          <button id="sendBtn" class="btn btn-primary text-nowrap" type="button">Gửi ➔</button>
          <button id="continueBtn" class="btn btn-outline-secondary text-light text-nowrap" type="button">Viết tiếp...</button>
        </div>
      </footer>
    </main>
  </div>

  <!-- Thư viện bổ trợ -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <!-- File Logic -->
  <script src="ai.js"></script>
</body>
</html>
